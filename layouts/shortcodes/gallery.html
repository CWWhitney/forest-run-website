{{- $dir := .Get "dir" | default "images/build" -}}
{{- $alt := .Get "alt" | default "Construction progress photo" -}}
<div class="photo-gallery{{ if eq (.Get "fit") "contain" }} contain{{ end }}">
{{- range readDir (printf "static/%s" $dir) -}}
  {{- if findRE `(?i)\.(jpe?g|png|webp)$` .Name }}
  <a href="/{{ $dir }}/{{ .Name }}"><img src="/{{ $dir }}/{{ .Name }}" alt="{{ $alt }}" loading="lazy"></a>
  {{- end }}
{{- end }}
</div>
<style>
.photo-gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:.5rem;margin:1rem 0}
.photo-gallery img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:4px;display:block}
.photo-gallery.contain img{object-fit:contain;background:#fff;border:1px solid #ddd}
</style>
